# Production deployment for meeting-analyzer (namespace: colossus-apps).
#
# Generated from the live cluster object. This file previously described a
# legacy deployment in the `whisper` namespace (container `analyzer`, code
# bind-mounted from the host, placeholder credentials) that no longer matched
# anything running -- applying it created a broken duplicate rather than
# reproducing production.
#
# Prerequisites, not created by this file:
#   secret/app-secrets          bulk app config, injected via envFrom
#   secret/meeting-analyzer-db  DATABASE_URL for analyzer-postgres.whisper
#
# The image below is a moving tag on purpose: the build pipeline pushes a
# digest and stamps it, along with colossus.io/built-sha, at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-analyzer
  namespace: colossus-apps
  labels:
    app: meeting-analyzer
    colossus-deployment-id: 0874d6b2-11de-4d5a-96a5-91c1463e091c
    managed-by: colossus
  annotations:
    colossus.io/app-repo: meeting-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meeting-analyzer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: meeting-analyzer
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      hostAliases:
      - ip: 192.168.50.250
        hostnames:
        - ubuntu.desmana-truck.ts.net
      containers:
      - name: app
        image: ubuntu:30500/meeting-analyzer:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        # Deliberately overrides the DATABASE_URL that app-secrets also supplies:
        # this app uses the analyzer database in the whisper namespace, not the
        # shared colossus one. Inline env wins over envFrom, so removing this
        # entry silently repoints the app at the wrong database.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: meeting-analyzer-db
              key: DATABASE_URL
        envFrom:
        - secretRef:
            name: app-secrets
            optional: true
        # Gates traffic until gunicorn is actually serving. Without it the
        # Service registers the pod as an endpoint the moment the container
        # starts, so every rollout serves 503s for the whole boot. Paired with
        # maxUnavailable: 0 above, this makes rollouts zero-downtime.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
